name: Collect Skinport

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: Schnnitter/steamai-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests brotli

      - name: Collect
        run: |
          python - <<'EOF'
          import gzip, json, datetime, os, requests
          r = requests.get(
              "https://api.skinport.com/v1/items",
              params={"app_id": 730, "currency": "EUR", "tradable": 1},
              headers={"Accept-Encoding": "br", "User-Agent": "SteamAi/0.1"},
              timeout=30,
          )
          print("items:", r.status_code)
          items = r.json() if r.status_code == 200 else None

          r2 = requests.get(
              "https://api.skinport.com/v1/sales/history",
              headers={"Accept-Encoding": "br", "User-Agent": "SteamAi/0.1"},
              timeout=30,
          )
          print("history:", r2.status_code)
          history = r2.json() if r2.status_code == 200 else None

          now = datetime.datetime.utcnow()
          day = now.strftime("%Y-%m-%d")
          stamp = now.strftime("%H%M")

          snapshot = {
              "ts": stamp, "day": day, "currency": "EUR", "app_id": 730,
              "items": {"status": r.status_code, "data": items},
              "history": {"status": r2.status_code, "data": history},
          }

          out_dir = f"data-repo/raw/{day}"
          os.makedirs(out_dir, exist_ok=True)
          out = f"{out_dir}/skinport-{stamp}.json.gz"
          with gzip.open(out, "wt", encoding="utf-8") as f:
              json.dump(snapshot, f, ensure_ascii=False)
          print("saved:", out, "records:", len(items or []))
          EOF

      - name: Commit and push
        run: |
          cd data-repo
          git config user.name "SteamAi Bot"
          git config user.email "steamai@local"
          git add -A
          git commit -m "collect $(date -u +%Y-%m-%d-%H%M)" || echo "nothing to commit"
          git push